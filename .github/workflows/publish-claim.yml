name: Publish daily claim

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/publish-claim.yml"
  schedule:
    - cron: "5 3 * * *"
  workflow_dispatch:
    inputs:
      publish_claim:
        description: Publish the next claim before deploying
        type: boolean
        default: true

concurrency:
  group: publish-daily-claim
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Publish next reviewed claim
        id: publish
        if: github.event_name == 'schedule' || inputs.publish_claim
        run: perl scripts/publish_next_claim.pl >> "$GITHUB_OUTPUT"

      - name: Regenerate publication files
        if: steps.publish.outputs.claim_id != ''
        run: perl scripts/generate_publication_copy.pl

      - name: Validate editorial and publication state
        run: perl scripts/check_editorial.pl

      - name: Install Jekyll
        run: gem install 'jekyll:3.10.0' kramdown-parser-gfm --no-document

      - name: Build site
        run: jekyll build --source docs --destination _site

      - name: Commit publication
        if: steps.publish.outputs.claim_id != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publication.json docs/_claims docs/_data/books.json docs/books docs/status.md
          git commit -m "Publish ${{ steps.publish.outputs.claim_id }}"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Warn when publication queue is low
        if: steps.publish.outputs.low == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REMAINING: ${{ steps.publish.outputs.remaining }}
        run: |
          echo "::warning::Only $REMAINING reviewed claims remain in the publication queue."
          existing=$(gh issue list --state open --search 'Publication queue is running low in:title' --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "Publication queue is running low" \
              --body "Only $REMAINING reviewed claims remain ready for daily publication. Please prepare another batch."
          fi

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact indexing
        run: sleep 15

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying deployment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry deployment once
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
