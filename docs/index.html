  <meta charset="utf-8">

  <meta name="description" content="Non-Prophet — coming soon.">
  <title>Non-Prophet — Coming soon</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <style>
    :root {
      color-scheme: light;
      --ink: #061a2b;
      --accent: #bd3e28;
      --paper: #fffaf0;
      --white: #fffefd;
      --muted: #66707a;
      --line: rgba(6, 26, 43, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.95) 0 24%, transparent 58%),
        linear-gradient(145deg, #fffdf8 0%, var(--paper) 56%, #f8eee0 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 2rem, 76rem);
      min-height: 100vh;
      margin-inline: auto;
      display: grid;
      grid-template-rows: 1fr auto;
    }

    main {
      display: grid;
      place-items: center;
      padding: clamp(3rem, 8vh, 6rem) 0 clamp(2.5rem, 6vh, 4rem);
      text-align: center;
    }

    .hero {
      display: flex;
      width: 100%;
      flex-direction: column;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--accent);
      font-size: clamp(0.75rem, 1.4vw, 0.9rem);
      font-weight: 750;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3.4rem, 10vw, 7.5rem);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 0.88;
    }

    .subtitle {
      margin: clamp(1.1rem, 2vw, 1.5rem) 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      letter-spacing: 0.04em;
    }

    .artwork-frame {
      width: min(100%, 39rem);
      margin-top: clamp(2rem, 5vw, 3.75rem);
      padding: clamp(0.5rem, 1.3vw, 0.8rem);
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.7);
      box-shadow: 0 2rem 5rem rgba(39, 29, 15, 0.13), 0 0.4rem 1rem rgba(39, 29, 15, 0.06);
    }

    .artwork-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 50%;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      padding: 1.4rem 0 1.75rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer p {
      margin: 0;
      letter-spacing: 0.025em;
    }

    .socials {
      display: flex;
      gap: 0.55rem;
    }

    .socials a {
      display: grid;
      width: 2.65rem;
      height: 2.65rem;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.58);
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 160ms ease, border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .socials a:hover {
      color: var(--white);
      border-color: var(--accent);
      background: var(--accent);
      transform: translateY(-2px);
    }

    .socials a:focus-visible {
      outline: 3px solid rgba(189, 62, 40, 0.28);
      outline-offset: 3px;
    }

    @media (max-width: 34rem) {
      .page {
        width: min(100% - 1.4rem, 76rem);
      }

      footer {
        flex-direction: column;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .socials a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">A new perspective</p>
        <h1 id="page-title">Non-Prophet</h1>
        <p class="subtitle">Coming soon</p>

        <div class="artwork-frame">
          <img src="assets/images/nonprophet.png" alt="An illustrated prophet holding a sign with a question mark" width="1254" height="1254">
        </div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Non-Prophet</p>
      <nav class="socials" aria-label="Follow Non-Prophet">
        <a href="https://www.youtube.com/@nonprophetapp" aria-label="Non-Prophet on YouTube" title="YouTube" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-youtube" aria-hidden="true"></i></a>
        <a href="https://www.tiktok.com/@nonprophetapp" aria-label="Non-Prophet on TikTok" title="TikTok" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-tiktok" aria-hidden="true"></i></a>
        <a href="https://www.instagram.com/nonprophetapp/" aria-label="Non-Prophet on Instagram" title="Instagram" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-instagram" aria-hidden="true"></i></a>
        <a href="https://bsky.app/profile/nonprophetapp.bsky.social" aria-label="Non-Prophet on Bluesky" title="Bluesky" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-bluesky" aria-hidden="true"></i></a>
      </nav>
    </footer>
  </div>
</body>
</html>
