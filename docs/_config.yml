title: Non-Prophet
description: A fair examination of claimed Old Testament prophecies fulfilled by Jesus.
url: https://nonprophet.app
baseurl: ""
timezone: Europe/London
permalink: pretty
theme: null
collections:
  claims:
    output: true
    permalink: /claims/:name/
defaults:
  - scope: {path: ""}
    values: {layout: default}
  - scope: {path: "", type: claims}
    values: {layout: claim}
exclude: [README.md]
