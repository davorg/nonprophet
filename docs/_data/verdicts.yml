source_claim_incorrect:
  label: Source claim incorrect
  description: The popular claim misstates what its cited text actually says.
plausible_prediction:
  label: Plausible prediction
  description: The passage makes a reasonably specific advance prediction that fits the claimed fulfilment.
retrospective_rereading:
  label: Retrospective rereading
  description: The connection depends on reading a later Christian conclusion back into an earlier text.
plausible_typology_not_prediction:
  label: Plausible typology, not prediction
  description: The comparison can work as a theological pattern, but the earlier text does not make a prediction.
thematic_parallel_only:
  label: Thematic parallel only
  description: The passages share an idea or image, but the resemblance does not establish prediction or fulfilment.
depends_on_disputed_text_or_translation:
  label: Depends on disputed text or translation
  description: The claim depends on a contested wording, translation, textual variant, or interpretation.
insufficiently_specific:
  label: Insufficiently specific
  description: The wording is too broad to identify Jesus or the claimed event in advance.
mixed_or_indeterminate:
  label: Mixed or indeterminate
  description: The evidence supports more than one reasonable conclusion or does not permit a confident verdict.
